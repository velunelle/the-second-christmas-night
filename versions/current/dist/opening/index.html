<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第十二个圣诞夜</title>
<style>
  :root { --klein: #235fd6; --black: #0a234e; --white: #f3f8ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  /* 碎完露出来的底层（独立运行时是空占位，嵌入时透出外层页面） */
  #home { position: fixed; inset: 0; opacity: 0; display: grid; place-items: center; background: transparent; color: #555;
    font: 15px system-ui, sans-serif; letter-spacing: .3em; }
  #stage { position: fixed; inset: 0; }
  .facet { position: absolute; inset: 0; }
  .card { position: absolute; inset: 0; will-change: transform; }
  .face { position: absolute; inset: 0; background: var(--bg); }
  /* 花：线稿当遮罩，线的颜色是 --line；跟底色一样时就藏着 */
  /* 花瓣填色：整朵花的剪影，颜色是 --fill（光有线在黑底上看不出来） */
  .fill { position: absolute; inset: 0; background: var(--fill); -webkit-mask: var(--fill-url, url("flowers_fill.svg?v=1023")) 0 0 / 100% 100% no-repeat; mask: var(--fill-url, url("flowers_fill.svg?v=1023")) 0 0 / 100% 100% no-repeat; }
  .art { position: absolute; inset: 0; background: var(--line); -webkit-mask: var(--flowers) 0 0 / 100% 100% no-repeat; mask: var(--flowers) 0 0 / 100% 100% no-repeat; }
  .decal { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  /* 真裂痕：从落点一圈圈露出来（--r0/--r1 由动画推大） */
  #stage { --r0: 0px; --r1: 0px; }
  .crk { position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    -webkit-mask: radial-gradient(circle at var(--cx) var(--cy), #000 var(--r), transparent calc(var(--r) * 1.8));
    mask: radial-gradient(circle at var(--cx) var(--cy), #000 var(--r), transparent calc(var(--r) * 1.8)); }
  #cracks, .cl { position: absolute; inset: 0; pointer-events: none; }
  /* 反色版三角里是克莱因蓝块，蓝裂纹会消失，那里提成白的 */
  .cl.bright img { filter: brightness(2.6) saturate(0); }
  .crk img { position: absolute; max-width: none; -webkit-mask: linear-gradient(#0000, #000 9%, #000 91%, #0000); mask: linear-gradient(#0000, #000 9%, #000 91%, #0000); }
  #dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--klein); transform: scale(0); }
  #grow { position: absolute; inset: 0; background: var(--klein); }
  #rim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bullet { position: absolute; height: 2px; transform-origin: 0 50%; background: linear-gradient(90deg, transparent, var(--klein) 30%, #9db4ff); box-shadow: 0 0 6px rgba(90, 130, 255, .8); }
  /* 等待中：素材没下完之前盖住整屏 */
  #loading { position: fixed; inset: 0; z-index: 8; background: var(--black); display: grid; place-content: center; justify-items: center; gap: 14px; color: rgba(243, 241, 236, .55); font: 11px/1 "Christmas Round", "Times New Roman", serif; letter-spacing: .32em; }
  #loading i { width: 10px; height: 10px; border-radius: 50%; background: var(--klein); animation: ld-beat 1.1s ease-in-out infinite; }
  #loading b { font-weight: 400; font-size: 10px; color: rgba(243, 241, 236, .3); letter-spacing: .2em; }
  @keyframes ld-beat { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-10px) scale(.9); } 60% { transform: translateY(0) scale(1.15, .85); } }
  #skip { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); color: rgba(255, 255, 255, .35); font: 12px system-ui; letter-spacing: .2em; z-index: 9; }
#loading i{background:transparent;font:54px "Christmas Round";color:#c9e4ff;width:auto;height:auto;border-radius:0}#loading b{font-size:13px;color:#c9e4ff}#skip{color:#f3f8ff99} .bullet{background:linear-gradient(90deg,transparent,#629dff,#f3f8ff)}
.face{background:linear-gradient(128deg,#ffffff44,transparent 30%,#ffffff18 53%,transparent 65%),var(--bg);box-shadow:inset 0 0 60px #ffffff14}.art{filter:drop-shadow(0 0 1px #ffffff66)}
#opening-snow{position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}#opening-hud{position:fixed;inset:10% 8% 7%;z-index:11;pointer-events:none;color:#eaf4ff;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 12px #09215e}#opening-en{font:12px "Christmas Round";letter-spacing:.2em}#opening-title{font:400 clamp(35px,6vw,68px)/1.4 "Christmas Round","Christmas Round",serif;letter-spacing:.08em;margin-top:12px}.load-box{margin-top:auto;width:min(430px,80vw);font:12px system-ui;letter-spacing:.08em}#load-bar{display:block;appearance:none;width:100%;height:3px;border:0;background:#ffffff33;margin:14px 0}#load-bar::-webkit-progress-bar{background:#ffffff22}#load-bar::-webkit-progress-value{background:#d8efff;box-shadow:0 0 14px #91bbff}#load-detail{font-size:11px;opacity:.7;min-height:30px}#skip{z-index:15}#loading{background:#0a234e}#loading span{visibility:hidden}
@font-face{font-family:"Christmas Round";src:url("../fonts/Christmas-Round.ttf") format("truetype");font-display:swap}html,body,h1,p,button,span,b,small{font-family:"Christmas Round",sans-serif!important}</style>
</head>
<body>
<div id="home" aria-hidden="true"></div>
<div id="stage"></div><canvas id="opening-snow" aria-hidden="true"></canvas><div id="opening-hud"><p id="opening-en">THE TWELFTH CHRISTMAS NIGHT</p><h1 id="opening-title">第十二个圣诞夜</h1><div class="load-box"><span id="load-percent">0%</span><progress id="load-bar" max="9" value="0" aria-label="城市加载进度"></progress><p id="load-detail">准备雪夜…</p></div></div>
<div id="loading" role="status"><i>✧</i><span>雪夜正在亮灯</span><b id="ld-n"></b></div>
<button id="skip" type="button" style="border:0;background:transparent;padding:12px;cursor:pointer">跳过动画</button>
<script src="../vendor/gsap.min.js"></script>
<script src="opening.js"></script><script src="snow.js"></script>

</body>
</html>
